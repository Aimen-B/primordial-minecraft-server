services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primordial-minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      - JVM_OPTS=-Xms4G -Xmx6G
      - TZ=UTC
    volumes:
      - ./server/world:/server/world
      - ./server/config:/server/config
      - ./server/mods:/server/mods
      - ./server/server.properties:/server/server.properties
      - ./server/ops.json:/server/ops.json
    stdin_open: true
    tty: true
